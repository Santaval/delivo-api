name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma client
        run: npx prisma generate --schema=src/infrastructure/prisma/schema.prisma

      - name: Drop and recreate database
        run: |
          url="${DATABASE_URL#mysql://}"
          creds="${url%%@*}"
          hostpart="${url#*@}"
          db="${hostpart#*/}"
          hostport="${hostpart%%/*}"
          host="${hostport%%:*}"
          port="${hostport#*:}"
          if [ "$port" = "$host" ]; then
            port=3306
          fi
          user="${creds%%:*}"
          password="${creds#*:}"
          mysql -h "$host" -P "$port" -u "$user" -p"$password" \
            -e "DROP DATABASE IF EXISTS \`$db\`; CREATE DATABASE \`$db\` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci; GRANT ALL PRIVILEGES ON \`$db\`.* TO '$user'@'%'; FLUSH PRIVILEGES;"

      - name: Run database migrations
        run: npx prisma migrate deploy --schema=src/infrastructure/prisma/schema.prisma

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7
